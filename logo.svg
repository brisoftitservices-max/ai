<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Teal Palette for Engineering / Gear / Snowflake -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146A8B" />
      <stop offset="100%" stop-color="#0E4A62" />
